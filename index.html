<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pop flix 🍿</title>
    <link rel="shortcut icon" href="./assets/favicon.png" type="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/app.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>
  <body class="bg-dark text-light">
    <header class="bg-header"> <!--header para la barra de navegacion -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark"> <!-- navbar-expand-lg Controla cuándo la navbar se expande/colapsa-->
      <div class="container" id="container-navbar">  <!--CONTAINER Centra el contenido y añade padding lateral --- Alternativas: container-fluid (en caso de necesitar ancho completo)-->

         <img src="assets/logo.png" alt="logo popflix" class="me-2"  style="width: 300px; height: auto;">

       <div class="ms-auto d-flex align-items-center">
            <button  class="btn btn-link btn-fil-nav text-white text-decoration-none ms-3"
                                  data-bs-toggle="offcanvas"  
                                  data-bs-target="#offcanvasFiltros"
                                  aria-controls="offcanvasFiltros">  
                                  <!-- toggle aabre el componente, offcanvas desliza desde un lado  -->
                                  <!-- aria  ayuda a que el sitio sea mas accesible para las personas -->
                        <span id="btn-filtros" class="me-2">Filtros</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-filter" viewBox="0 0 16 16">
              <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/>
                         </svg>
             </button>
       </div>
      
         <!--Barra de busqueda-->
        
            <div class="d-none d-lg-flex align-items-center w-50">
              <div class="input-group">
                <input type="text" id="inputSearch" class="form-control bg-dark text-white border-secondary" placeholder="Búsqueda..."> 
              </div>  
            </div>  

              <button class="btn btn-link btn-fil-nav text-white d-lg-none"
                  data-bs-toggle="offcanvas" 
                  data-bs-target="#offcanvasBusqueda"
                  aria-controls="offcanvasBusqueda">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
          </button>

         </div>
      </div>
    </nav>
  </header>
    <section id="hero" class="container my-5">
    </section>

    <main id="rowsContainer" class="container my-4">
    </main>

    <footer class="footer">
        <div class="waves">
          <div class="wave" id="wave1"></div>
          <div class="wave" id="wave2"></div>
          <div class="wave" id="wave3"></div>
          <div class="wave" id="wave4"></div>
        </div>
        <ul class="social-icon">
          <li class="social-icon__item"><a class="social-icon__link" href="#">
            <img src="/assets/facebook1.png" alt="Facebook" />
            </a>
          </li>
      
          <li class="social-icon__item"><a class="social-icon__link" href="#">
            <img src="/assets/instagram.png" alt="Instagram" />
            </a>
          </li>
          <li class="social-icon__item"><a class="social-icon__link" href="#">
            <img src="/assets/linkedin.png" alt="Linkedin" />
            </a>
          </li>
        </ul>
        <p>
          POPFLIX🍿 Copyright © 2025 popflix - Todos los derechos reservados   || Creador por: nosotros 
        </p>
    </footer>

<!--html para el filtro lateral -->
    <div class="offcanvas offcanvas-start bg-dark text-light" tabindex="-1" id="offcanvasFiltros" aria-labelledby="offcanvasFiltrosLabel">
      <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title" id="offcanvasFiltrosLabel">Filtrar por Género</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div id="lista-generos" class="d-grid gap-2">
          <p>Cargando géneros...</p>
        </div>
      </div>
    </div>

    <div class="offcanvas offcanvas-top bg-dark text-light" tabindex="-1" id="offcanvasBusqueda" aria-labelledby="offcanvasBusquedaLabel">
          <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title" id="offcanvasBusquedaLabel">Buscar Película</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <input type="text" id="inputSearchMobile" class="form-control bg-dark text-white border-secondary" placeholder="Búsqueda...">
         </div>
    </div>

    <!-- Modal para el detalle de al película-->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content modal-dark">
          <button type="button" class="btn-close btn-close-white modal-close" data-bs-dismiss="modal" aria-label="Close"></button>
          <div id="detailBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="config.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
